# ─── NGINX REVERSE PROXY CONFIGURATION FOR FESTOS V2.0 ──────────────────────
# Place in /etc/nginx/sites-available/festos and symlink to /etc/nginx/sites-enabled/
# Replace your-domain.com with your actual domain or VPS IP address.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Client upload limits for audio tracks & attachments
    client_max_body_size 50M;

    # Compression settings
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Proxy to Docker container on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy transactions
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets caching optimization
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }
}
